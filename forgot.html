<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #dce4e2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 360px;
    }

    .card h2 {
      color: #1e7e4e;
      text-align: center;
      font-size: 22px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: #333;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #dcdcdc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #1e7e4e;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #1e7e4e;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #16603b;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #1e7e4e;
      text-decoration: none;
      font-weight: 600;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🔑 Reset Password</h2>
    <p class="subtitle">Enter your registered details to receive a recovery link/OTP</p>

    <form>
      <div class="form-group">
        <label for="recovery">Email or Mobile Number</label>
        <input 
          type="text" 
          id="recovery" 
          name="recovery" 
          placeholder="Enter email or 10-digit mobile" 
          required 
        />
      </div>

      <button type="submit" class="btn">Send Reset Link</button>
    </form>

    <a href="Tester.html" class="back-link">← Back to Login</a>
  </div>

</body>
</html>
