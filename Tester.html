<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fridge Recipe Matcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-emerald-50 min-h-screen font-sans">

  <!-- Login Page -->
  <div id="loginPage" class="flex items-center justify-center min-h-screen">
    <div class="max-w-sm w-full bg-white p-6 rounded-2xl shadow-md border border-emerald-100">
      <h1 class="text-2xl font-bold text-emerald-700 mb-4 text-center">🔐 Login</h1>
      
      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-600 mb-1">Username</label>
        <input id="username" type="text" placeholder="Enter Username"
               class="w-full border border-gray-300 p-2 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
      </div>
      
      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-600 mb-1">Password</label>
        <input id="password" type="password" placeholder="Enter Password"
               class="w-full border border-gray-300 p-2 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
      </div>
      
      <button onclick="checkLogin()" 
              class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-semibold">
        Login
      </button>
      <p id="errorMsg" class="text-red-500 text-sm mt-2 hidden">❌ Invalid credentials</p>
    </div>
  </div>

  <!-- Main Page (hidden initially) -->
  <div id="mainPage" class="hidden p-6">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-md border border-amber-100">
      <h1 class="text-2xl font-bold text-emerald-700 mb-2">🍳 Fridge Recipe Matcher</h1>
      <p class="text-xs text-gray-500 mb-4">
        FOODS ARE NOT JUST A SOURCE OF ENERGY BUT ACTUALLY LOVE THAT WE SHOW BY COOKING WITH RIGHT INGREDIANTS.🤝👪
        <br>Click a preset below or type custom ingredients!
      </p>
      
      <!-- Quick Demo Preset Buttons -->
      <div class="mb-4">
        <p class="text-xs font-semibold text-gray-600 mb-2">⚡LIST OF THE ITEMS :</p>
        <div class="flex flex-wrap gap-2">
          <button onclick="showRecipe('tea')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded-lg font-bold">☕ Tea Setup</button>
          <button onclick="showRecipe('rasmalai')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded-lg font-bold">🥛 Rasmalai Setup</button>
          <button onclick="showRecipe('lassi')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded-lg font-bold">🥭 Mango Lassi Setup</button>
          <button onclick="showRecipe('pancakes')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded-lg font-bold">🥞 Pancakes Setup</button>
          <button onclick="showRecipe('omelette')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded-lg font-bold">🍳 Omelette Setup</button>
          <button onclick="showRecipe('fruit salad')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded-lg font-bold">🥗 Fruit Salad Setup</button>
          <button onclick="showRecipe('chocolate cake')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded-lg font-bold">🍰 Chocolate Cake Setup</button>
          <button onclick="showRecipe('lays')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded-lg font-bold">🍝 Lays (Spanish Tomato Tango 🌶️)</button>
        </div>
      </div>

      <!-- Manual Ingredient Input -->
      <div class="flex gap-2 mb-4">
        <input id="ingredientInput" type="text" placeholder="Type ingredient (e.g. ginger)..." 
               class="border border-gray-300 p-2 rounded-lg flex-1 outline-none focus:ring-2 focus:ring-emerald-500">
        <button onclick="addIngredient()" 
                class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-semibold">Add</button>
      </div>

      <!-- Active Ingredients Tags -->
      <div id="ingredientList" class="flex flex-wrap gap-2 mb-4"></div>

      <!-- Submit Button -->
      <button onclick="getRecipes()" class="w-full bg-amber-500 hover:bg-amber-600 text-white py-3 rounded-lg font-bold text-lg transition shadow-md">Find Recipes</button>

      <!-- Results Area -->
      <div id="results" class="mt-6 space-y-4 text-gray-800"></div>
    </div>
  </div>

  <script>
    function checkLogin() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      if (user === "Shadow Break" && pass === "SD262") {
        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("mainPage").classList.remove("hidden");
      } else {
        document.getElementById("errorMsg").classList.remove("hidden");
      }
    }

    function addIngredient() {
      const input = document.getElementById("ingredientInput");
      if (input.value.trim() !== "") {
        document.getElementById("ingredientList").innerHTML += `<span class="bg-emerald-100 text-emerald-800 px-2 py-1 rounded">${input.value}</span>`;
        input.value = "";
      }
    }

    function getRecipes() {
      document.getElementById("results").innerHTML = "<p class='font-semibold text-emerald-700'>🍴 Matching recipes will appear here...</p>";
    }

    // Real recipes data
    const recipes = {
      tea: "Boil 1 cup water, add 2 tsp tea leaves, 1 inch crushed ginger, 2 crushed cardamoms. Add 1 cup milk, 2 tsp sugar. Simmer and strain.",
      rasmalai: "Boil 1L milk, curdle with lemon juice. Shape discs, cook in sugar syrup. Soak in saffron-cardamom milk, garnish with nuts.",
      lassi: "Blend 1 ripe mango, 1 cup yogurt, 1/2 cup milk, 2 tsp sugar, pinch cardamom, and ice cubes until smooth.",
      pancakes: "Mix 1 cup flour, 1 tbsp sugar, 1 tsp baking powder, 1 egg, 1 cup milk. Cook on pan until golden. Serve with syrup.",
      omelette: "Beat 2 eggs with onion, tomato, chili, coriander. Cook in pan with oil until set, fold and serve.",
      "fruit salad": "Mix chopped seasonal fruits (mango, banana, papaya, berries). Add honey and lime juice dressing.",
      "chocolate cake": "Mix 1 cup flour, 1/2 cup cocoa, 1 cup sugar, 1/2 cup butter, 2 eggs, 1 cup milk. Bake at 180°C for 30 mins.",
      lays: "Spanish Tomato Tango flavor: potato chips seasoned with tangy tomato powder, chili, and spices."
    };

    function showRecipe(item) {
      document.getElementById("results").innerHTML = `<div class="p-4 bg-emerald-50 rounded-lg shadow"><h2 class="font-bold text-lg text-emerald-700">📖 Recipe for ${item}</h2><p class="mt-2 text-sm">${recipes[item]}</p></div>`;
    }
  </script>
</body>
</html>
