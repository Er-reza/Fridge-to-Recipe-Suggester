<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fridge Recipe Matcher</title>
 <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-amber-50 min-h-screen p-6 font-sans">
  <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-md border border-amber-100">
    <h1 class="text-2xl font-bold text-emerald-700 mb-2">🍳 Fridge Recipe Matcher</h1>
    <p class="text-xs text-gray-500 mb-4">
      FOODS ARE NOT JUST A SOURCE OF AN ENERGY BUT ACTUALLY THEY ARE LOVE THAT WE SHOW BY COOKING WITH RIGHT INGREDIANTS.🤝👪
     <br Click a preset below or type custom ingredients!</p>
    
    <!-- Quick Demo Preset Buttons -->
    <div class="mb-4">
      <p class="text-xs font-semibold text-gray-600 mb-2">⚡LIST OF THE ITEMS :</p>
      <div class="flex flex-wrap gap-2">
        <button onclick="loadPreset('tea')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded-lg font-bold">☕ Tea Setup</button>
        <button onclick="loadPreset('rasmalai')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded-lg font-bold">🥛 Rasmalai Setup</button>
        <button onclick="loadPreset('lassi')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded-lg font-bold">🥭 Mango Lassi Setup</button>
        <button onclick="loadPreset('pancakes')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded-lg font-bold">🥞 Pancakes Setup</button>
        <button onclick="loadPreset('omelette')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded-lg font-bold">🍳 Omelette Setup</button>
        <button onclick="loadPreset(' fruit salad')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded-lg font-bold">🥗 fruit Salad Setup</button>
        <button onclick="loadPreset('chocolate cake')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded-lg font-bold">🍰 Chocolate Cake Setup</button>
        <button onclick="loadPreset('Spanish tomato tango lays ')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded-lg font-bold">🍝 lays(spanish tomato tango version🌶️)</button>
        

      </div>
    </div>

    <!-- Manual Ingredient Input -->
    <div class="flex gap-2 mb-4">
      <input id="ingredientInput" type="text" placeholder="Type ingredient (e.g. ginger)..." 
             class="border border-gray-300 p-2 rounded-lg flex-1 outline-none focus:ring-2 focus:ring-emerald-500">
      <button 
      onclick="addIngredient(
        For Making 2 Cups of Tea 
        <br water:1cup(240ml)
<br milk:1 cup(240ml)
<br Tea leaves:2 tsp
<br sugar: 2 tsp
<br Fresh Ginger: 1 inch piece, crushed
<br Cardamom: 2 pods, crushed )"
      onclick="addIngredient(Makes 6 to 8 Discs of Rasmalai 
        <br Milk: 1 liter 
        <br Lemon Juice: 2 tbsp
        <br Sugar: 1 cup
        <br Cardamom Powder: 1/2 tsp
        <br Saffron: a few about 10-12 strands
        <br Pistachios/Almonds(crushed): 2 tbsp)"
      onclick="addIngredient(For making 2 servings of Mango Lassi 
        <br Ripe Mango: 1 large
        <br Yogurt: 1 cup
        <br Milk: 1/2 cup
        <br Sugar: 2 tsp (adjust to taste)
        <br Cardamom Powder: a pinch
        <br Ice Cubes:(a few of 5 to 6 cubes)" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-semibold">Add</button>
    </div>

    <!-- Active Ingredients Tags -->
    <div id="ingredientList" class="flex flex-wrap gap-2 mb-4"></div>

    <!-- Submit Button -->
    <button onclick="getRecipes()" class="w-full bg-amber-500 hover:bg-amber-600 text-white py-3 rounded-lg font-bold text-lg transition shadow-md">Find Recipes</button>

    <!-- Results Area -->
    <div id="results" class="mt-6 space-y-4 text-gray-800"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
